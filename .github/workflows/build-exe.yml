name: Build ToonieRemoter.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.77.2 (Windows 8 / Server 2012 compatible)
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup default 1.77.2
      - name: Build release
        run: cargo build --release
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ToonieRemoter
          path: target/release/toonie_remoter.exe
